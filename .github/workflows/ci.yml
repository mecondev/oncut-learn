name: ci

on:
  push:
    branches: [main]
    # Docs only: nothing to compile or build. Lessons (courses/**) are not
    # ignored. No ci run means no deploy either (deploy.yml follows ci).
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run; on main
# that older commit then never deploys, as deploy.yml also checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover tools/validate -v

  snippets-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/validate/validate.py --compiler gcc

  snippets-clang:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/validate/validate.py --compiler clang

  snippets-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Puts cl on PATH, as the Developer PowerShell for VS does for a student.
      # Third-party actions are pinned to a commit, since a tag can be moved;
      # the comment says which release that commit is.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: python tools/validate/validate.py --compiler msvc

  # The toolchain the Windows lesson installs: MSYS2 UCRT64 and its current g++.
  # Compiler messages differ between g++ versions (setup test, 2026-10-17), so
  # the messages a lesson quotes are checked against this one too.
  snippets-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - run: python tools/validate/validate.py --compiler gcc

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check

  # Every content rule must fail the build; a few minutes of builds.
  build-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python tools/build_rules/check_build_rules.py
